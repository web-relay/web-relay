<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Relay Launcher</title><link rel="stylesheet" href="popup.css"></head><body><header><h1>Web Relay</h1><button id="refresh" aria-label="Refresh capabilities">↻</button></header><p id="context">Active browser context</p><label class="sr-only" for="search">Search commands</label><input id="search" type="search" placeholder="Search commands or tabs…" autocomplete="off"><form id="question-form" hidden><h2 id="question-title"></h2><label for="question">Question</label><textarea id="question" required maxlength="2000" rows="4" placeholder="What would you like to ask?"></textarea><p class="hint">Send this text to the selected capability.</p><button id="question-send" type="button">Run action</button><button id="question-cancel" type="button">Back</button></form><div id="commands" aria-label="Commands"></div><p id="status" role="status" aria-live="polite">Discovering capabilities…</p><details><summary>Capability sources</summary><div id="sources"></div><label class="toggle"><input id="github-enabled" type="checkbox" checked> Enable GitHub provider</label><p class="hint">The demo trusts localhost:4173 and the paired development provider. App functions execute in their owning application.</p></details><footer>↑ ↓ select · Enter run · Esc close</footer><script type="module" src="popup.js"></script></body></html>
